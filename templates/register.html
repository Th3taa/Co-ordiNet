{% extends "base.html" %}

{% block title %}Register - Student Events{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="main-container">
                <h2 class="text-center mb-4">
                    <i class="bi bi-person-plus"></i> Register
                </h2>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="grade" class="form-label">Grade</label>
                            <input type="number" class="form-control" id="grade" name="grade" min="0" max="12" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="section" class="form-label">Section</label>
                            <input type="text" class="form-control" id="section" name="section" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="birthdate" class="form-label">Birthdate</label>
                            <input type="date" class="form-control" id="birthdate" name="birthdate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="B">Male</option>
                                <option value="G">Female</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text" id="passwordReq"></div>
                    </div>
                    <div class="mb-3">
                        <label for="confirmation" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmation" name="confirmation" required>
                        <div class="form-text" id="confirmHelp"></div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-custom w-100">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                </form>
                <hr>
                <p class="text-center">
                    Already have an account? <a href="{{ url_for('login') }}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    const password = document.getElementById("password");
    const confirmation = document.getElementById("confirmation");
    const passwordReq = document.getElementById("passwordReq");
    const confirmHelp = document.getElementById("confirmHelp");

    function validatePasswords() {
        const value = password.value;
        const hasMinLength = value.length >= 8;
        const hasUppercase = /[A-Z]/.test(value);
        const hasDigit = /\d/.test(value);
        const hasSpecial = /[^A-Za-z0-9]/.test(value);
    
        if (!hasMinLength || !hasUppercase || !hasDigit || !hasSpecial) {
            passwordHelp.textContent =
                "At least 8 characters, 1 uppercase letter, 1 number, 1 special character";
            passwordHelp.className = "form-text text-danger";
            password.setCustomValidity("Invalid password");
        } else {
            passwordHelp.textContent = "Strong password.";
            passwordHelp.className = "form-text text-success";
            password.setCustomValidity("");
        }

        if (confirmation.value && password.value !== confirmation.value) {
            confirmHelp.textContent = "Passwords do not match.";
            confirmHelp.className = "form-text text-danger";
            confirmation.setCustomValidity("Passwords do not match");
        } else {
            confirmHelp.textContent = "";
            confirmation.setCustomValidity("");
        }
    }

    password.addEventListener("input", validatePasswords);
    confirmation.addEventListener("input", validatePasswords);
</script>
{% endblock %}
