{% extends 'base.html' %}{% block content %}<div class="page-wrapper"><div class="app-card sm"><div class="main-container"><h2 class="text-center">{{ Purpose }} verification</h2><p class="text-muted text-center">Your current OTP was printed in the Flask terminal.</p><form method="post"><label class="form-label">Six-digit OTP<input class="form-control" name="otp" inputmode="numeric" required autofocus></label>{% if Purpose == 'Password reset' %}<label class="form-label">New password<input class="form-control" name="password" type="password" minlength="8" required></label>{% endif %}<div class="text-center mt-4"><button class="btn btn-gradient">Verify</button></div></form></div></div></div>{% endblock %}
