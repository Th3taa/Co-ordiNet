{% extends "admin_base.html" %}

{% block title %}Dashboard - Admin{% endblock %}

{% block content %}
<div class="main-container">
    <h2 class="mb-4">
        <i class="bi bi-calendar3"></i> Admin Dashboard
    </h2>
    
    <div class="admin-actions mb-4">
        <a href="{{ url_for('add_student') }}" class="btn btn-primary">
            <i class="bi bi-person-add"></i> Add Student
        </a>
        <a href="{{ url_for('manage_students') }}" class="btn btn-secondary">
            <i class="bi bi-person"></i> Manage Student
        </a>
        <a href="{{url_for('new_academic_session')}}" class="btn btn-success">
            <i class="bi bi-calendar-plus"></i> New Academic Year
        </a>
</div>
{% endblock %}
